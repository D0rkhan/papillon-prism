name: Prism — APK de test (émulateur)

# Debug-signed x86_64 APK for an Android emulator on a PC, to check a change
# before it reaches the phone. Run by hand; the APK is a build artifact, never
# a release, so the app's « Mettre à jour » button never offers it.
on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Architecture"
        default: "x86_64"
        required: true

permissions:
  contents: read

jobs:
  apk:
    if: github.repository != 'PapillonApp/Papillon'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Gradle settings
        run: |
          chmod +x android/gradlew
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "reactNativeArchitectures=${{ inputs.abi }}"
          } >> android/gradle.properties

      # Release build (bundled JS, Hermes) signed with the debug key: no secret needed.
      - name: Build APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prism-test-${{ inputs.abi }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
